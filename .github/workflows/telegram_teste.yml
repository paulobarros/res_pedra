name: Teste Telegram
on:
  push:
    branches: [telegram-bot]
    paths: ['.github/workflows/telegram_teste.yml']
  workflow_dispatch:

jobs:
  enviar-teste:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensagem de teste ao canal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          resposta=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=🧪 <b>Teste do bot</b> — Monitoramento do Reservatório da Pedra. Se você está vendo isso, a integração com o GitHub Actions funcionou.")
          echo "$resposta" | jq '{ok, error_code, description, chat: .result.chat.title, message_id: .result.message_id}'
          echo "$resposta" | jq -e '.ok' > /dev/null
