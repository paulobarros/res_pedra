name: Teste fase 2 (temporário)
on:
  push:
    branches: [previsao-fase2]
    paths: ['.github/workflows/teste_fase2.yml']
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: |
            any::dplyr
            any::httr2
            any::echarts4r
            any::htmltools
            any::zoo
            any::xml2
            any::terra
            any::ranger
            any::tidyr
            any::lubridate
      - name: Coleta, previsão, comunicados (sem Telegram) e render — nada é publicado
        env:
          DRY_RUN: "true"
        run: |
          Rscript coleta_bacia.R --forcar
          Rscript previsao_afluencia.R --forcar
          Rscript comunicados_axia.R
          quarto render
          grep -c 'Afluência · 7 dias' docs/index.html
